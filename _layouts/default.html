<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% assign desc = page.description | default: site.description %}
  <meta name="description" content="{{ desc }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title and page.title != 'Timeline' %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <a class="name" href="{% if page.profile %}{{ page.url | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">{{ site.title }}</a>
    <nav>
      {% unless page.profile %}<a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/theory-of-change/' | relative_url }}">Theory of Change</a><a href="{{ '/full/' | relative_url }}">Timeline</a><a href="{{ '/physical-ai-safety/' | relative_url }}">Physical AI Safety Map</a>{% endunless %}
    </nav>
  </header>
  <main>{{ content }}</main>
</body>
</html>
