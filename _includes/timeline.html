<ul class="legend" aria-label="Color key">{% for c in site.data.categories %}<li><i style="--c: var(--{{ c.color }})"></i>{{ c.label }}</li>{% endfor %}</ul>
<div id="tl" class="tl" data-placeholders="false" data-tag="{{ include.tag }}" data-profile="{{ include.profile }}"></div>
<script id="tl-data" type="application/json">
{"today": "{{ site.time | date: '%Y-%m' }}",
 "chapters": {{ site.data.chapters | jsonify }},
 "streams": {{ site.data.streams | jsonify }},
 "profiles": {{ site.data.profiles | jsonify }},
 "categories": {{ site.data.categories | jsonify }},
 "tracks": {{ site.data.tracks | jsonify }},
 "events": {{ site.data.timeline | jsonify }}}
</script>
<script src="{{ '/assets/timeline.js' | relative_url }}"></script>
<noscript><p>Turn on JavaScript to see the timeline.</p></noscript>
