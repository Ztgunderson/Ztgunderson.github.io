{% assign w = include.w %}<li{% if w.image and w.image != "" %} class="has-img"{% endif %}>{% if w.image and w.image != "" %}<a href="{{ w.url }}" tabindex="-1" aria-hidden="true"><img class="post-img" src="{{ w.image | relative_url }}" alt="" width="96" height="64"></a>{% endif %}<a href="{{ w.url }}">{{ w.title }}</a> <span class="muted">{{ w.section }}{% if w.venue and w.venue != "" %} · {{ w.venue }}{% endif %}{% if w.date != "" %} · {% include fdate.html d=w.date %}{% endif %}</span>{% if w.summary != "" %}<p class="post-sum">{{ w.summary }}</p>{% endif %}</li>
