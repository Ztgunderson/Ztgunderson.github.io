- id: founder
  title: Founder
  headline: Engineer and founder building for AI safety
  subtitle: 'I start things and get them into people''s hands: an edge AI consulting company that put computer vision into production for a client, an HVAC tooling startup improving air quality on construction sites, and Layterms, a public education project on AI risk. Now I''m putting that founder experience to work on AI safety.

    '
  intros:
    now: 'Since July 2026 I''ve worked on AI safety full time. As a founder, that means building Layterms for everyday voters, joining StartingBlock''s Level Set program, and grounding it all in my own safety research.

      '
    engineering: 'College is where I started building companies: Gundy Neural Designs, my edge AI consulting company, and Arkin & Gunderson, an HVAC tooling startup improving air quality on construction sites, plus founding and leading the Unload team.

      '
    foundations: 'Early practice in making things people pay for: running embroidery production for the school''s student business and a paid youth apprenticeship in product development.

