- id: safety-gov
  title: Technical governance
  headline: Engineer working on technical AI governance
  subtitle: 'I''ve deployed AI on real hardware, and now I work on how to verify and govern it: training in compute verification and AI forecasting, evaluation research on how AI agents behave, and organizing with lawmakers on AI policy.

    '
  intros:
    now: 'Since July 2026 I''ve worked on AI safety full time, with a focus on technical governance: compute verification and AI futures training, evaluation research, coaching others through AI Control, and organizing on AI policy in Wisconsin.

      '
