# Research home page (/). YOUR WORDS go here.
# Rule: any field left blank ("") is hidden on the site, so you can publish
# with only some sections filled in. Prompts are in the comments above each field.

# One sentence, outcome first: [what you do] + [for whom] + [toward which outcome].
# Strong examples name a specific threat (Apollo: "reducing risks from scheming frontier AI").
# Your Oct 16 mission, verbatim (spelling only). Previous (Oct 14): "Make sure edge robots are monitored, because continual
# learning and automated data collection make traditional AI safety risks worse."
mission: "Improving the transparency of Robotic Foundational Models through improving monitoring methods and red team evaluations to build intervention methods and standards for Physical AI Control."

# "Now" banner (Neel Nanda pins one call to action above everything). Your words.
# e.g. what you're doing this month + one ask. Leave text blank to hide.
now:
  text: ""
  link_label: ""
  link_url: ""

# The headline people see first (max ~10 words). Current site headline kept for now.
# Draft (AI-written, removed): "Edge AI engineer working on AI safety". Blank = your name shows.
headline: ""

# ~75 spoken words: problem -> what I do -> one proof ("first"/result) -> why me -> the ask.
# 30-SECOND PITCH: three points, your words, ~25 words each (~75 spoken words total).
pitch:
  # Oct 16, your words verbatim (spelling fixes only: Transiioning -> Transitioning).
  who_i_am: "Edge AI engineer working on Physical AI safety for Generalist Robotics. Track record of deploying computer vision projects in production. Transitioning into Cloud and Physical AI Safety through hackathons, workshop papers, and public code."
  # Shown as "What I do". Previous one-liner (Oct 15 v2): "Using edge based small trusted models to monitor misalignment or
  # prevent misuse on cloud models and RFM in generalist robotic tasks."
  scope: "I build agent monitoring methods and benchmark to improve AI oversight deployed in robotics and agent systems."
  how_i_can_help: "Building evaluations to audit model behavior for creating policies, guiding robotic foundation models development, and contributing to open source monitoring methods and benchmarks for other scientist working in the field of Physical AI Safety."

# Scope: one sentence on what you work on, then 2-4 short "in" and "not now" items.
# Your Oct 14 draft, to edit or replace: "Make sure edge robots are monitored, because
# continual learning and automated data collection make traditional AI safety risks worse."
scope:
  # Your Oct 15 one-liner, verbatim (v2).
  sentence: "Using edge based small trusted models to monitor misalignment or prevent misuse on cloud models and RFM in generalist robotic tasks."
  in: []        # e.g. - "..."
  not_now: []   # your say-no list, e.g. - "..."

# Theory of change. One line each. Blank lines are hidden.
