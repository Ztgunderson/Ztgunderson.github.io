# Research home page (/). YOUR WORDS go here.
# Rule: any field left blank ("") is hidden on the site, so you can publish
# with only some sections filled in. Prompts are in the comments above each field.

# One sentence, outcome first: [what you do] + [for whom] + [toward which outcome].
# Strong examples name a specific threat (Apollo: "reducing risks from scheming frontier AI").
# Currently your own Oct 14 draft sentence, verbatim. Edit or replace it.
mission: "Make sure edge robots are monitored, because continual learning and automated data collection make traditional AI safety risks worse."

# "Now" banner (Neel Nanda pins one call to action above everything). Your words.
# e.g. what you're doing this month + one ask. Leave text blank to hide.
now:
  text: ""
  link_label: ""
  link_url: ""

# The headline people see first (max ~10 words). Current site headline kept for now.
# Draft (AI-written, removed): "Edge AI engineer working on AI safety". Blank = your name shows.
headline: ""

# ~75 spoken words: problem -> what I do -> one proof ("first"/result) -> why me -> the ask.
# Draft (AI-written, removed). Write your own ~75-word pitch.
pitch: ""

# Scope: one sentence on what you work on, then 2-4 short "in" and "not now" items.
# Your Oct 14 draft, to edit or replace: "Make sure edge robots are monitored, because
# continual learning and automated data collection make traditional AI safety risks worse."
scope:
  # Your Oct 15 one-liner, verbatim.
  sentence: "Using edge based small trusted models to monitor cloud models and RFM in generalist robotic tasks."
  in: []        # e.g. - "..."
  not_now: []   # your say-no list, e.g. - "..."

# Theory of change. One line each. Blank lines are hidden.
theory_of_change:
  gap: ""            # "Nobody measures whether ___"
  who_is_blind: ""   # who can't see the risk today
  artifact: ""       # what you build
  who_uses_it: ""    # a named kind of user (evaluators, robot integrators, ...)
  decision: ""       # the decision your artifact changes
  outcome: ""        # the mission outcome if it works
  least_sure: ""     # the assumption you trust least
  change_my_mind: "" # the result that would make you change plans

# --- Patterns from Josiah Hanna's UW page (all your words) ---
# Headshot: put the file at assets/headshot.jpg and set photo: "assets/headshot.jpg". Blank = hidden.
photo: ""
# First-person bio, ~3 sentences (Hanna opens with "I am ..."). Shown under the pitch.
bio: ""
# Third-person short bio for talk intros, Substack, programs (others can copy it). 3-5 sentences.
short_bio: ""
# CV link (PDF or Google Doc). Blank = hidden.
cv_url: ""
# One instruction per audience (Hanna separates PhD applicants vs undergrads).
# e.g. - { who: "Researchers", how: "..." }  - { who: "Recruiters", how: "..." }  - { who: "Students / WAISI", how: "..." }
audiences: []

# How I can help: concrete offers, each one line. (Khullani's ask.)
how_i_can_help: []
# What I'm looking for: roles, collaborators, mentors, funding. Each one line.
looking_for: []

contact:
  email: ""   # shown as "name [at] domain" to cut spam
  substack: "https://zacharygunderson.substack.com/"
  x: ""        # e.g. https://x.com/yourhandle (blank = hidden)
  youtube: ""  # your channel URL (blank = hidden)
