  gap: ""            # "Nobody measures whether ___"
  who_is_blind: ""   # who can't see the risk today
  artifact: ""       # what you build
  who_uses_it: ""    # a named kind of user (evaluators, robot integrators, ...)
  decision: ""       # the decision your artifact changes
  outcome: ""        # the mission outcome if it works
  short_term: ""     # 0-6 months
  medium_term: ""    # 6-24 months
  long_term: ""      # 2+ years
  path: ""           # programs/funding sequence, e.g. TAIS -> Rapid -> Career Transition -> PAISI
  least_sure: ""     # the assumption you trust least
  change_my_mind: "" # the result that would make you change plans

