  title: 'Apart Research sprint: Discovering honeypots from resampled behavior in evaluation'
  summary: Solo project at the AI Incident Response Sprint. I tested whether covert model behavior on SHADE-Arena can be found by resampling a model's actions rather than its reasoning, then turned into honeypots. The main finding was that discovery is compute-bound; I released the adaptive search method for others to validate.
