  title: Fake news detector, MadData '23 hackathon
  summary: In 24 hours at UW–Madison's MadData '23 hackathon, our team of four built a working website that flags whether a news article is likely real or fake by averaging the predictions of several machine learning models. I worked on the back end, building and testing models including Naive Bayes, a decision tree, and a Passive Aggressive classifier, and dropped the ones that performed poorly on our dataset.
