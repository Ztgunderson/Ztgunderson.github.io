  title: Run the Lab! – Game built for Layterms at Mangrove's Game Night hackathon
  summary: Part of Layterms, my grassroots AI safety education project. I built this three-minute game at Mangrove's AI safety game hackathon. You play the CEO of an AI lab choosing between pushing capabilities and investing in alignment. Its three rounds show why labs race without rules, why rules fail without verification, and how hardware checks on AI chips can make holding back safe.
