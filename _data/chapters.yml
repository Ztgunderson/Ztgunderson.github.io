- id: now
  title: AI Safety
  layer: canopy
  years: 2026 – now
  intro: 'In July 2026 I left production computer vision work to move into AI safety full time. My focus is whether safety holds up once generalist AI models run on real hardware at the edge, plus helping everyday voters understand AI risk.

    '
  intros:
    entrepreneurship: 'Since July 2026: building Layterms and its games for everyday voters, alongside TempVents.'
    leadership: 'Leading in this phase means showing up for others: going to Washington with my mom, and helping neighbors understand AI risk.'
    ai-safety: 'In July 2026 I moved into AI safety full time: two research sprints, two expert-tier courses, and community organizing in Wisconsin.'
    advocacy: 'Since July 2026 I''ve spent much of my time on the civic side of AI safety: organizing with ControlAI Wisconsin, volunteering with AISAP, and meeting lawmakers in Washington.'
