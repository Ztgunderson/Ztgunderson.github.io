- id: foundations
  title: McFarland High School and Indian Mound Middle School
  layer: roots
  years: 2012 – 2021
  intro: 'The first seeds were youth wrestling and a VEX IQ robotics team. In high school they took root: on the wrestling mat and the football line I learned that most of leadership is showing up first, staying last, and making room for the people behind you. In the school shops and a youth apprenticeship I started a pattern I still follow: teach myself a machine nobody is using, get it producing something real, then teach the team.

    '
  intros:
    entrepreneurship: 'My first taste of running production: the embroidery side of the school''s student-run business.'
    leadership: 'Where I learned to lead: three-time wrestling captain, football captain, an academic letter, a coach-nominated character award, scholarships, a paid youth apprenticeship in electrical engineering, and training my team in the school''s manufacturing business.'
    education: An academic letter, AP courses, the Metals 1–3 sequence, and college electronics courses at Madison College before I graduated high school.
