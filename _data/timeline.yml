- id: tibetan-asr
  chapter: now
  category: ai-safety
  tracks:
  - ai-safety-pivot
  tags:
  - ai-safety
  - technical
  date: '2026-08-10'
  title: 'Research poster, IFDS Research Expo: Domain and capacity in low-resource Tibetan speech recognition'
  summary: 'My hunch was that a speech model trained on New Testament readings would fail the languages of other cultures. Meta''s MMS learned Tibetan almost entirely from scripture read by a single speaker. I benchmarked it, then fine-tuned it on a Jetson AGX Orin with a parameter-efficient adapter, using secular Tibetan news recordings from far more speakers than Meta used. Changing the training domain cut character error rate from 24.1% to 19.9% with no change to English. Full fine-tuning reached 16.0% but made English 0.96 points worse. Quantizing to INT4 barely mattered (0.2 points): the data was the limit, not the bit width.'
  status: sourced
  sources:
  - label: Code (GitHub)
    url: https://github.com/Ztgunderson/TibetianBuddhismTransciptionPipeline
